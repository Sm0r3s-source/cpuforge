[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/model",
    "crates/io",
    "crates/train",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# Tests run numerical code; optimize them so gradient checks stay fast.
[profile.test]
opt-level = 2
