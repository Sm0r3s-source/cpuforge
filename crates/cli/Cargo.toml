[package]
name = "cf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cpuforge command line interface"

[[bin]]
name = "cpuforge"
path = "src/main.rs"

[dependencies]
cf-core = { path = "../core" }
cf-model = { path = "../model" }
cf-io = { path = "../io" }
cf-train = { path = "../train" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1.0.154"
ureq = "3.4.2"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
